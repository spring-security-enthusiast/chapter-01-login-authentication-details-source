spring:
  application:
    name: demo
  data:
    web:
      pageable:
        one-indexed-parameters: true
        default-page-size: 10
      sort:
        sort-parameter: sort
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    name: example
    username: sa
    password:
    generate-unique-name: false
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    show-sql: true
    generate-ddl: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        format_sql: true
        generate_statistics: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
logging:
  level:
    root: INFO
    org:
      hibernate:
        SQL: INFO
        orm:
          jdbc:
            bind: INFO
      flywaydb: DEBUG  # Add this to see Flyway logs

app:
  tenancy:
    base-domain: localhost